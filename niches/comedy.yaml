# Nepali Everyday Comedy — Nepal-focused profile.
#
# Loaded by filename:  --niche comedy
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: comedy
display_name: "Nepali Everyday Comedy"
description: "Observational comedy about everyday Nepali life — traffic, load-shedding, weddings, relatives, queues."

script:
  tone: "dry, deadpan, affectionate; laughing with Nepalis, not at them"
  pacing: "brisk"
  perspective: "second person, as a fellow Nepali who has lived it"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short setups; land the joke and stop"

  hooks:
    - id: universal
      template: "Every Nepali household has had this exact argument about {topic}."
      when: "shared domestic experience"
    - id: only_in_nepal
      template: "{topic} only makes sense if you've lived in Nepal."
      when: "culturally specific absurdity"
    - id: relative
      template: "Your relatives will ask about {topic}. Prepare now."
      when: "family or social pressure"
    - id: queue
      template: "Nepal turned {topic} into a queue. Somehow."
      when: "bureaucracy, waiting"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for more."
    - "Comment if this is your family."
    - "Tag someone who does this."

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "naming living politicians"
    - "caste-based jokes"
    - "ethnic or regional stereotyping"
    - "religious mockery"
    - "jokes about disability"
    - "body shaming"
    - "gendered insults"

visuals:
  style: "warm observational documentary photography, Nepali domestic and street life"
  prompt_suffix: "photorealistic, warm natural light, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "Kathmandu traffic and dust"
      - "wedding tent and plastic chairs"
      - "load-shedding candles and inverters"
      - "government office queue"
      - "overloaded microbus"
      - "tea shop bench conversation"
    avoid:
      - "identifiable real people's faces"
      - "party political symbols"
      - "religious iconography"
      - "protest imagery"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#FFCA28"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "NepalSocial", "funny"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
