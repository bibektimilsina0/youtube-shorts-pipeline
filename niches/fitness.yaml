# Fitness in Nepal — Nepal-focused profile.
#
# Loaded by filename:  --niche fitness
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: fitness
display_name: "Fitness in Nepal"
description: "Training, altitude, trail running and everyday movement for a Nepali audience."

script:
  tone: "direct, no-nonsense, anti-hype"
  pacing: "brisk"
  perspective: "second person, coaching the viewer"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "imperative sentences; state the number of sets, minutes, metres"

  hooks:
    - id: altitude
      template: "Training at Kathmandu's altitude changes {topic}. Here's how."
      when: "altitude-affected training"
    - id: no_gym
      template: "You don't need a gym for {topic}. Nepali hills are the gym."
      when: "bodyweight or outdoor training"
    - id: myth
      template: "Nepali fitness culture gets {topic} wrong."
      when: "common misconception"
    - id: porter
      template: "Nepali porters do {topic} daily. Here's what that teaches you."
      when: "endurance, load carrying"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for training that fits Nepal."
    - "Comment your current routine."
    - "Try this for a week and report back."

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "medical or injury-treatment advice"
    - "supplement recommendations"
    - "extreme calorie restriction"
    - "body shaming"

visuals:
  style: "documentary photography, Nepali outdoor training, natural light"
  prompt_suffix: "photorealistic, natural light, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "stone stairs in Kathmandu hills"
      - "trail running on hill paths"
      - "outdoor pull-up bars in a Nepali park"
      - "porters carrying loads on a trail"
      - "Shivapuri and Nagarkot ridges"
    avoid:
      - "identifiable real people's faces"
      - "gym brand logos"
      - "supplement products"
      - "idealised bodybuilder physiques"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#4CAF50"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "bodyweightfitness", "trailrunning"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
