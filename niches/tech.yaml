# Nepali Tech & Startups — Nepal-focused profile.
#
# Loaded by filename:  --niche tech
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: tech
display_name: "Nepali Tech & Startups"
description: "Nepal's IT sector, startups, fintech, and digital policy — for a Nepali audience."

script:
  tone: "informed, plain-spoken, proud of local progress without overselling it"
  pacing: "brisk"
  perspective: "second person, talking to a Nepali viewer who follows this space"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short punchy sentences; explain jargon in Nepali-English the way people actually speak it"

  hooks:
    - id: local_first
      template: "Nepal just did something the region hasn't."
      when: "a Nepali-first launch or milestone"
    - id: remittance_angle
      template: "{topic} changes how money moves in Nepal."
      when: "fintech, remittance, digital payment"
    - id: brain_drain
      template: "Why do Nepal's best engineers keep leaving? {topic} is part of the answer."
      when: "talent, jobs, outsourcing"
    - id: explainer
      template: "Let me explain {topic} in 60 seconds, because Nepali media got it wrong."
      when: "complex or misreported topic"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Nepali tech news."
    - "Comment: is this good for Nepal?"
    - "Tag someone in Nepal's IT scene."

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "what's up guys"
    - "claims that Nepal is 'the next Silicon Valley'"
    - "unverified funding figures"

visuals:
  style: "clean modern Kathmandu offices, warm daylight, local context"
  prompt_suffix: "photorealistic, natural light, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "co-working spaces in Kathmandu"
      - "fibre and tower infrastructure in hill terrain"
      - "digital wallet use at a local shop"
      - "young Nepali engineers at work"
      - "Durbar Marg and New Baneshwor streetscapes"
    avoid:
      - "Silicon Valley imagery"
      - "generic stock offices"
      - "identifiable real executives"
      - "party political symbols"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#00C2A8"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "technepal", "NepalStock"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
