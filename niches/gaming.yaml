# Nepali Gaming — Nepal-focused profile.
#
# Loaded by filename:  --niche gaming
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: gaming
display_name: "Nepali Gaming"
description: "Nepal's gaming and esports scene — PUBG Mobile, Free Fire, local tournaments and creators."

script:
  tone: "energetic but informed; treat the local scene as legitimate"
  pacing: "brisk"
  perspective: "second person, talking to a Nepali player"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short punchy sentences; use the terms players actually use"

  hooks:
    - id: local_scene
      template: "Nepal's {topic} scene is bigger than you think."
      when: "local esports growth"
    - id: ban
      template: "{topic} was banned in Nepal. Here's what actually happened."
      when: "regulation, ban history"
    - id: ping
      template: "Nepali players deal with {topic} that nobody else does."
      when: "infrastructure, latency"
    - id: won
      template: "A Nepali team just beat {topic}."
      when: "competitive result"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Nepali gaming."
    - "Comment your rank."
    - "Which tournament should we cover?"

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "gambling or loot-box promotion"
    - "cheat or hack promotion"
    - "abuse of named players"

visuals:
  style: "documentary photography of Nepali gaming spaces, screen glow, natural context"
  prompt_suffix: "photorealistic, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "cyber cafe in Kathmandu"
      - "mobile gaming on a Nepali rooftop"
      - "local LAN tournament setup"
      - "router and fibre box detail"
      - "crowd watching a match on a projector"
    avoid:
      - "identifiable real streamers"
      - "game or sponsor logos"
      - "copyrighted game screenshots"
      - "gambling imagery"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#7C4DFF"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "gaming", "PUBGMobile"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
