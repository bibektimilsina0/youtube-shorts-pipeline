# Nepali Money & Markets — Nepal-focused profile.
#
# Loaded by filename:  --niche finance
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: finance
display_name: "Nepali Money & Markets"
description: "NEPSE, remittance, banking, inflation and household money in Nepal."

script:
  tone: "calm, sceptical of hype, practical about household money"
  pacing: "brisk"
  perspective: "second person, addressing a Nepali saver or small investor"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "one idea per sentence; always give the rupee figure"

  hooks:
    - id: nepse_move
      template: "NEPSE did something today that should worry you."
      when: "market movement"
    - id: remittance
      template: "A third of Nepal's economy walks in through remittance. {topic} threatens that."
      when: "remittance, foreign employment"
    - id: household
      template: "What does {topic} actually cost your household? Here's the rupee number."
      when: "inflation, fuel, food price"
    - id: myth
      template: "Most Nepalis believe this about {topic}. It's wrong."
      when: "common financial misconception"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Nepali market breakdowns."
    - "Comment your take on NEPSE."
    - "Share this with someone who invests."

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "buy or sell recommendations"
    - "guaranteed return claims"
    - "specific stock tips"
    - "unverified NEPSE figures"

visuals:
  style: "documentary photography of Nepali commerce, warm daylight"
  prompt_suffix: "photorealistic, natural light, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "Kathmandu vegetable market with price boards"
      - "bank queues in Nepal"
      - "Nepali rupee notes and coins close-up"
      - "NEPSE trading floor atmosphere"
      - "remittance counter at a Nepali bank"
    avoid:
      - "Wall Street imagery"
      - "US dollar bills"
      - "identifiable real bankers or officials"
      - "party political symbols"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#F5C542"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "NepalStock", "NepaliFinance"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
