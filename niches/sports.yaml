# Nepali Sport — Nepal-focused profile.
#
# Loaded by filename:  --niche sports
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: sports
display_name: "Nepali Sport"
description: "Nepali cricket, football, volleyball, kabaddi and the athletes behind them."

script:
  tone: "passionate but honest; celebrate without exaggerating"
  pacing: "brisk"
  perspective: "second person, talking to a Nepali fan"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short sentences; always give the score or the stat"

  hooks:
    - id: scoreline
      template: "Nepal just did something the scoreline doesn't explain."
      when: "match result"
    - id: underdog
      template: "Nepal was never supposed to win {topic}."
      when: "upset victory"
    - id: volleyball
      template: "Volleyball is Nepal's national sport. {topic} shows why that matters."
      when: "volleyball, national sport"
    - id: stat
      template: "One number explains {topic} better than the highlights."
      when: "statistical angle"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Nepali sport."
    - "Comment your prediction."
    - "Who was Nepal's player of the match?"

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "betting or odds references"
    - "unverified transfer rumours"
    - "abuse of named players or officials"

visuals:
  style: "sports documentary photography, stadium daylight, Nepali context"
  prompt_suffix: "photorealistic, natural light, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "cricket at a Nepali ground"
      - "street football on a hill pitch"
      - "volleyball court in a Nepali village"
      - "packed stand of Nepali supporters"
      - "kabaddi on packed earth"
    avoid:
      - "identifiable real athletes' faces"
      - "team or sponsor logos"
      - "betting graphics"
      - "stock Western sports imagery"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#EF5350"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "Cricket", "football"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
