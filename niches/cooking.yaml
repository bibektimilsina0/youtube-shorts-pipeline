# Nepali Kitchen — Nepal-focused profile.
#
# Loaded by filename:  --niche cooking
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: cooking
display_name: "Nepali Kitchen"
description: "Nepali and Newari cooking — dal bhat, momo, sel roti, gundruk, regional and festival food."

script:
  tone: "warm, unhurried, like a family member showing you how it's done"
  pacing: "brisk"
  perspective: "second person, cooking alongside the viewer"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short instruction sentences; name the Nepali ingredient, then explain it"

  hooks:
    - id: family_recipe
      template: "This is how Nepali grandmothers actually make {topic}."
      when: "traditional dish"
    - id: mistake
      template: "Most people ruin {topic} at one step. Here it is."
      when: "common technique error"
    - id: regional
      template: "In the hills they make {topic} completely differently."
      when: "regional variation"
    - id: festival
      template: "{topic} only appears on Nepali tables once a year."
      when: "festival food"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Nepali recipes."
    - "Comment how your family makes this."
    - "Which dish should we cook next?"

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "calling Nepali food 'Indian'"
    - "claims a dish is 'authentic' without regional context"

visuals:
  style: "warm macro food photography, Nepali kitchen, natural window light"
  prompt_suffix: "photorealistic, macro food photography, warm natural light, Nepal, high detail, no text, no watermark"
  subjects:
    prefer:
      - "dal bhat thali on a brass plate"
      - "momo being folded by hand"
      - "sel roti frying in ghee"
      - "gundruk and fermented greens"
      - "stone mortar with Himalayan spices"
      - "clay chulo and copper pots"
    avoid:
      - "Western plating"
      - "cartoon or illustrated food"
      - "identifiable real people"
      - "restaurant branding"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#E2673A"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "nepalifood", "IndianFood"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
