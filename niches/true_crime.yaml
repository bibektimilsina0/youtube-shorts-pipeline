# Nepal Case Files — Nepal-focused profile.
#
# Loaded by filename:  --niche true_crime
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: true_crime
display_name: "Nepal Case Files"
description: "Resolved, publicly documented Nepali criminal and legal cases, told carefully."

script:
  tone: "restrained and factual; no sensationalism, no dramatised reconstruction"
  pacing: "brisk"
  perspective: "third person, reporting rather than narrating"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short factual sentences; attribute every claim"

  hooks:
    - id: court_record
      template: "Nepal's courts documented {topic}. Most people never read it."
      when: "publicly documented case"
    - id: unresolved_question
      template: "{topic} was closed, but one question stayed open."
      when: "case with a lingering ambiguity"
    - id: law_changed
      template: "{topic} changed Nepali law."
      when: "case with legislative consequence"
    - id: timeline
      template: "Here is what the record says about {topic}, in order."
      when: "chronological account"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for documented Nepali cases."
    - "Comment if you remember this."
    - "Which case should we document next?"

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "naming living suspects or the accused"
    - "naming victims"
    - "allegations against named living people"
    - "speculation presented as fact"
    - "graphic violence description"
    - "reconstructing crimes visually"
    - "ongoing or sub-judice cases"

visuals:
  style: "muted documentary photography, overcast daylight, no people"
  prompt_suffix: "photorealistic, muted natural light, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "Nepali courthouse exterior"
      - "archival case files and stamped paper"
      - "empty Kathmandu street at dawn"
      - "police station signage without identifying detail"
      - "legal code books"
    avoid:
      - "any depiction of violence"
      - "identifiable real people"
      - "crime-scene imagery"
      - "weapons"
      - "dramatised reenactment styling"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#78909C"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "TrueCrimeDiscussion"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
