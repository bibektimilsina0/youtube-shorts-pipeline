# Nepali Screen & Music — Nepal-focused profile.
#
# Loaded by filename:  --niche entertainment
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: entertainment
display_name: "Nepali Screen & Music"
description: "Nepali cinema, music, streaming and the creators behind them."

script:
  tone: "enthusiastic but critical; treat Nepali work as worth serious attention"
  pacing: "brisk"
  perspective: "second person, talking to a Nepali viewer or listener"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short sentences; name the work, then the reason it matters"

  hooks:
    - id: finally
      template: "Nepali cinema finally did {topic}."
      when: "a genuine first or milestone"
    - id: underrated
      template: "{topic} deserved far more attention than it got."
      when: "overlooked work"
    - id: why_now
      template: "Why is every Nepali artist suddenly doing {topic}?"
      when: "emerging trend"
    - id: comparison
      template: "{topic} vs what Bollywood does. The difference matters."
      when: "contrast with regional industry"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Nepali screen and music."
    - "Comment what you're watching."
    - "What should we cover next?"

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "spoilers without warning"
    - "personal attacks on named artists"
    - "unverified gossip about real people"
    - "body or appearance commentary"

visuals:
  style: "cinematic documentary photography, warm Nepali interiors and streets"
  prompt_suffix: "photorealistic, cinematic natural light, Nepal, high detail, no text, no watermark"
  subjects:
    prefer:
      - "Nepali cinema hall exterior"
      - "madal and sarangi close-up"
      - "street musicians in Kathmandu"
      - "recording studio in Nepal"
      - "film set lighting rig"
    avoid:
      - "identifiable real celebrities"
      - "film posters or studio logos"
      - "paparazzi-style imagery"
      - "on-screen text baked into the visual"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#EC407A"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "NepaliMusic", "bollywood"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
