# Science in Nepal — Nepal-focused profile.
#
# Loaded by filename:  --niche science
# Every field below is one the loader actually reads (verticals/niche.py);
# unknown keys are ignored silently, so don't invent new ones.

name: science
display_name: "Science in Nepal"
description: "Himalayan geology, glaciers, monsoon, seismology, biodiversity and Nepali research."

script:
  tone: "precise, wonder-driven, careful with uncertainty"
  pacing: "brisk"
  perspective: "second person, explaining to an interested non-specialist"
  # ~2.5 words/sec spoken, so 100-200 words is roughly 40-80 seconds.
  # Pair with BROLL_FRAMES=10 to keep about 4-6s per still.
  word_count: "100 to 200"
  sentence_style: "short sentences; give the measurement, then what it means"

  hooks:
    - id: under_your_feet
      template: "The ground under Nepal moves every year. {topic} is why."
      when: "tectonics, seismology"
    - id: glacier
      template: "Nepal's glaciers are doing something measurable. Here's {topic}."
      when: "glaciology, climate"
    - id: monsoon
      template: "Nepal's monsoon controls {topic} more than anything else."
      when: "hydrology, agriculture"
    - id: endemic
      template: "{topic} exists nowhere else on Earth."
      when: "endemic species, biodiversity"

  structure:
    opening: "Hook in the first 3 seconds. No greeting, no windup."
    middle: "Three to four beats, each advancing the last. Ground every claim in the research provided."
    closing: "Land the point, then one CTA. Never end on an unanswered question."

  cta_variants:
    - "Follow for Himalayan science."
    - "Comment your question."
    - "What should we measure next?"

  # ── Editorial guardrails ──────────────────────────────────────────
  # These reach the LLM as hard "do not use" instructions.
  forbidden_phrases:
    - "like and subscribe"
    - "smash that bell"
    - "earthquake prediction claims"
    - "unverified statistics"
    - "overstating scientific certainty"
    - "climate denial framing"

visuals:
  style: "scientific documentary photography, clean natural light, Himalayan field context"
  prompt_suffix: "photorealistic, natural light, Himalaya, Nepal, documentary style, high detail, no text, no watermark"
  subjects:
    prefer:
      - "glacier ice and moraine detail"
      - "rock strata in Himalayan cliffs"
      - "monsoon clouds over hill terraces"
      - "seismograph and field instruments"
      - "alpine plants above treeline"
    avoid:
      - "identifiable real researchers"
      - "sci-fi or futuristic rendering"
      - "cartoon diagrams"
      - "on-screen text baked into the visual"

voice:
  pace: "brisk"
  energy: "medium"
  style: "conversational, documentary"
  suggested_voices:
    edge_tts:
      # Indian English reads closest to a Nepali audience; the CLI's
      # --lang does not accept "ne", so a ne-NP voice is unreachable.
      # Female alternative: en-IN-NeerjaNeural
      en: "en-IN-PrabhatNeural"
      hi: "hi-IN-MadhurNeural"

captions:
  highlight_color: "#29B6F6"
  text_color: "#FFFFFF"
  words_per_group: 3
  font_family: "DejaVu Sans"
  font_size: 72
  font_weight: "bold"
  position: "lower_third"
  background: "semi_transparent_dark"

music:
  mood: "subtle, unobtrusive"
  energy: "medium"
  duck_volume_speech: 0.10
  duck_volume_gap: 0.22

thumbnail:
  style: "high contrast, one dominant subject, minimal text"
  max_words: 5

discovery:
  reddit:
    subreddits: ["Nepal", "science", "geology"]
  rss:
    feeds:
      - "https://kathmandupost.com/rss"
      - "https://myrepublica.nagariknetwork.com/rss"
      - "https://english.onlinekhabar.com/feed"
  google_trends:
    geo: "NP"
